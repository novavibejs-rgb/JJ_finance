{% extends "layout/base.html" %} {% block titulo %} Nova Despesa {% endblock %}
{% block conteudo %}

<div class="form-container">
  <h1>💼 Nova Despesa</h1>

  <form method="POST">
    <!-- Proteção CSRF -->
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <div class="form-row">
      <div class="form-group">
        <label>Categoria</label>
        <input class="form-control" type="text" name="categoria" />
      </div>

      <div class="form-group">
        <label>Valor</label>
        <input class="form-control" type="number" step="0.01" name="valor" />
      </div>
    </div>
    <div class="form-group">
      <label>Descrição</label>
      <input class="form-control" type="text" name="descricao" />
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Data</label>
        <input class="form-control" type="date" name="data" />
      </div>

      <div class="form-group">
        <label>Observação</label>
        <textarea class="form-control" name="observacao" rows="3"></textarea>
      </div>
    </div>
    <div class="form-actions">
      <a href="{{ url_for('despesas.index') }}" class="btn btn-danger">
        Cancelar
      </a>

      <button type="submit" class="btn btn-primary">💾 Salvar Despesa</button>
    </div>
  </form>
</div>

{% endblock %}
