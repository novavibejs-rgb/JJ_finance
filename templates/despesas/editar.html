{% extends "layout/base.html" %} {% block titulo %} Editar Despesa {% endblock
%} {% block conteudo %}

<h1>Editar Despesa</h1>

<form method="POST">
  <label>Categoria</label>
  <input type="text" name="categoria" value="{{ despesa[1] }}" />

  <br />

  <label>Descrição</label>
  <input type="text" name="descricao" value="{{ despesa[2] }}" />

  <br />

  <label>Valor</label>
  <input type="number" step="0.01" name="valor" value="{{ despesa[3] }}" />

  <br />

  <label>Data</label>
  <input type="date" name="data" value="{{ despesa[4] }}" />

  <br />

  <label>Observação</label>
  <textarea name="observacao">{{ despesa[5] }}</textarea>

  <br />

  <button type="submit">Salvar Alteração</button>
</form>

{% endblock %}
