{% extends "layout/base.html" %} {% block titulo %} Editar Despesa {% endblock
%} {% block css %}

<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/despesas.css') }}"
/>

{% endblock %} {% block conteudo %}

<div class="pagina-editar-despesa">
  <!-- =====================================================
         CABEÇALHO
    ====================================================== -->

  <div class="pagina-cabecalho">
    <div>
      <h1>✏️ Editar Despesa</h1>

      <p>Atualize as informações da despesa.</p>
    </div>
  </div>

  <!-- =====================================================
         FORMULÁRIO
    ====================================================== -->

  <form method="POST" class="form-editar-despesa">
    <!-- CSRF -->

    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

    <!-- =================================================
             CATEGORIA
        ================================================== -->

    <div class="form-grupo">
      <label for="categoria"> Categoria </label>

      <input
        type="text"
        id="categoria"
        name="categoria"
        value="{{ despesa[1] }}"
        required
      />
    </div>

    <!-- =================================================
             DESCRIÇÃO
        ================================================== -->

    <div class="form-grupo">
      <label for="descricao"> Descrição </label>

      <input
        type="text"
        id="descricao"
        name="descricao"
        value="{{ despesa[2] }}"
        required
      />
    </div>

    <!-- =================================================
             VALOR + DATA
        ================================================== -->

    <div class="form-linha-despesa">
      <div class="form-grupo">
        <label for="valor"> Valor </label>

        <input
          type="number"
          id="valor"
          name="valor"
          step="0.01"
          min="0"
          value="{{ despesa[3] }}"
          required
        />
      </div>

      <div class="form-grupo">
        <label for="data"> Data </label>

        <input
          type="date"
          id="data"
          name="data"
          value="{{ despesa[4] }}"
          required
        />
      </div>
    </div>

    <!-- =================================================
             OBSERVAÇÃO
        ================================================== -->

    <div class="form-grupo">
      <label for="observacao"> Observação </label>

      <textarea id="observacao" name="observacao">{{ despesa[5] }}</textarea>
    </div>

    <!-- =================================================
             AÇÕES
        ================================================== -->

    <div class="form-editar-acoes">
      <a href="{{ url_for('despesas.index') }}" class="btn-cancelar-despesa">
        Cancelar
      </a>

      <button type="submit" class="btn-salvar-despesa">
        💾 Salvar Alteração
      </button>
    </div>
  </form>
</div>

{% endblock %}
