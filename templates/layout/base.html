<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block titulo %}J&J Finance{% endblock %}</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/forms.css') }}"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/buttons.css') }}"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/tables.css') }}"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/socios.css') }}"
    />
    {% block css %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>

  <body>
    {% include "layout/navbar.html" %}

    <div class="mobile-menu-container">
      <button
        class="mobile-menu-btn"
        id="mobileMenuBtn"
        type="button"
        aria-label="Abrir menu"
      >
        ☰
      </button>

      <span class="mobile-menu-text">Menu</span>
    </div>

    <main class="app-container">
      {% include "layout/sidebar.html" %}

      <section class="conteudo">{% block conteudo %}{% endblock %}</section>
    </main>

    <script>
      const mobileMenuBtn = document.getElementById("mobileMenuBtn");
      const sidebar = document.querySelector(".sidebar");

      mobileMenuBtn.addEventListener("click", function (event) {
        event.stopPropagation();

        sidebar.classList.toggle("mobile-open");
      });

      // Fecha o menu ao clicar fora
      document.addEventListener("click", function (event) {
        if (!sidebar.classList.contains("mobile-open")) {
          return;
        }

        // Se clicou dentro do menu, não fecha
        if (sidebar.contains(event.target)) {
          return;
        }

        // Se clicou no botão Menu, não fecha
        if (mobileMenuBtn.contains(event.target)) {
          return;
        }

        // Clique fora → fecha
        sidebar.classList.remove("mobile-open");
      });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
