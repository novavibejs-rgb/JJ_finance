<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login - J&J Finance</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/login.css') }}"
    />
  </head>

  <body>
    <main class="login-page">
      <div class="login-card">
        <!-- =================================================
                 MARCA
                 ================================================= -->

        <div class="login-brand">
          <div class="login-logo">J&J</div>

          <div class="login-brand-text">
            <h1>J&J Finance</h1>

            <span> Sistema de Gestão Financeira </span>
          </div>
        </div>

        <!-- =================================================
                 CABEÇALHO
                 ================================================= -->

        <div class="login-header">
          <h2>Bem-vindo de volta!</h2>

          <p>Entre na sua conta para continuar.</p>
        </div>

        <!-- =================================================
                 ERRO
                 ================================================= -->

        {% if erro %}

        <div class="login-alert">
          <span class="login-alert-icon"> ⚠️ </span>

          <span> {{ erro }} </span>
        </div>

        {% endif %}

        <!-- =================================================
                 FORMULÁRIO
                 ================================================= -->

        <form
          method="POST"
          action="{{ url_for('auth.login') }}"
          class="login-form"
        >
          <!-- USUÁRIO -->

          <div class="login-field">
            <label for="usuario"> Usuário </label>

            <div class="login-input-wrapper">
              <span class="login-input-icon"> 👤 </span>

              <input
                type="text"
                id="usuario"
                name="usuario"
                placeholder="Digite seu usuário"
                autocomplete="username"
                required
                autofocus
              />
            </div>
          </div>

          <!-- SENHA -->

          <div class="login-field">
            <label for="senha"> Senha </label>

            <div class="login-input-wrapper">
              <span class="login-input-icon"> 🔒 </span>

              <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Digite sua senha"
                autocomplete="current-password"
                required
              />

              <button
                type="button"
                class="login-show-password"
                id="mostrarSenha"
                aria-label="Mostrar senha"
              >
                👁️
              </button>
            </div>
          </div>

          <!-- =================================================
                     BOTÃO
                     ================================================= -->

          <button type="submit" class="login-submit">
            <span> Entrar no sistema </span>

            <span class="login-submit-arrow">⏭</span>
          </button>
        </form>

        <!-- =================================================
                 RODAPÉ
                 ================================================= -->

        <div class="login-footer">
          <span class="login-security"> 🔐 Acesso protegido </span>

          <span class="login-version"> J&J Finance </span>
        </div>
      </div>
    </main>

    <!-- =========================================================
         MOSTRAR / OCULTAR SENHA
         ========================================================= -->

    <script>
      const senha = document.getElementById("senha");
      const mostrarSenha = document.getElementById("mostrarSenha");

      mostrarSenha.addEventListener("click", function () {
        if (senha.type === "password") {
          senha.type = "text";

          mostrarSenha.textContent = "🙈";
        } else {
          senha.type = "password";

          mostrarSenha.textContent = "👁️";
        }
      });
    </script>
  </body>
</html>
