{% extends "layout/base.html" %} {% block css %}
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/funcionarios.css') }}"
/>
{% endblock %} {% block titulo %} Editar Funcionário {% endblock %} {% block
conteudo %}
<div class="page-header">
  <div>
    <h1>✏️ Editar Funcionário</h1>
    <p>Atualize os dados do funcionário.</p>
  </div>

  <a class="btn btn-secondary" href="{{ url_for('funcionarios.index') }}">
    ← Voltar
  </a>
</div>

<!-- =========================================================
     FORMULÁRIO
========================================================= -->

<div class="card funcionario-form">
  <form method="POST">
    <!-- Proteção CSRF -->
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <!-- NOME -->

    <div class="form-group">
      <label for="nome"> Nome completo </label>

      <input
        type="text"
        id="nome"
        name="nome"
        value="{{ funcionario['nome'] }}"
        required
      />
    </div>

    <!-- CARGO -->

    <div class="form-group">
      <label for="cargo"> Cargo </label>

      <input
        type="text"
        id="cargo"
        name="cargo"
        value="{{ funcionario['cargo'] or '' }}"
      />
    </div>

    <!-- E-MAIL -->

    <div class="form-group">
      <label for="email"> E-mail </label>

      <input
        type="email"
        id="email"
        name="email"
        value="{{ funcionario['email'] or '' }}"
      />
    </div>

    <!-- TELEFONE -->

    <div class="form-group">
      <label for="telefone"> Telefone </label>

      <input
        type="text"
        id="telefone"
        name="telefone"
        value="{{ funcionario['telefone'] or '' }}"
      />
    </div>

    <!-- DATA DE ADMISSÃO -->

    <div class="form-group">
      <label for="data_admissao"> Data de admissão </label>

      <input
        type="date"
        id="data_admissao"
        name="data_admissao"
        value="{{ funcionario['data_admissao'] or '' }}"
      />
    </div>

    <!-- =================================================
             STATUS

             NÃO É EDITADO MANUALMENTE.
             O SISTEMA CONTROLA ONLINE/OFFLINE.
        ================================================== -->

    <!-- AÇÕES -->

    <div class="form-actions">
      <a class="btn btn-secondary" href="{{ url_for('funcionarios.index') }}">
        Cancelar
      </a>

      <button type="submit" class="btn btn-primary">
        💾 Salvar Alterações
      </button>
    </div>
  </form>
</div>

{% endblock %}
