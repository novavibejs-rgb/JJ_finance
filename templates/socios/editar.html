{% extends "layout/base.html" %} {% block css %}
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/socios.css') }}"
/>
{% endblock %} {% block titulo %} Editar Sócio {% endblock %} {% block conteudo
%}

<div class="page-header">
  <div>
    <h1>✏️ Editar Sócio</h1>
    <p>Atualize os dados do sócio.</p>
  </div>

  <a class="btn btn-secondary" href="{{ url_for('socios.index') }}">
    ← Voltar
  </a>
</div>

<div class="card socio-form">
  <form method="POST">
    <!-- NOME -->

    <div class="form-group">
      <label for="nome"> Nome completo </label>

      <input
        type="text"
        id="nome"
        name="nome"
        value="{{ socio['nome'] }}"
        required
      />
    </div>

    <!-- E-MAIL -->

    <div class="form-group">
      <label for="email"> E-mail </label>

      <input
        type="email"
        id="email"
        name="email"
        value="{{ socio['email'] or '' }}"
      />
    </div>

    <!-- TELEFONE -->

    <div class="form-group">
      <label for="telefone"> Telefone </label>

      <input
        type="text"
        id="telefone"
        name="telefone"
        value="{{ socio['telefone'] or '' }}"
      />
    </div>

    <!-- AÇÕES -->

    <div class="form-actions">
      <a class="btn btn-secondary" href="{{ url_for('socios.index') }}">
        Cancelar
      </a>

      <button type="submit" class="btn btn-primary">
        💾 Salvar Alterações
      </button>
    </div>
  </form>
</div>

{% endblock %}
