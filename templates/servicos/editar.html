{% extends "layout/base.html" %} {% block titulo %} Editar Serviço {% endblock
%} {% block css %}

<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/servicos.css') }}"
/>
{% endblock %} {% block conteudo %}

<div class="pagina-cabecalho">
  <div>
    <h1>Editar Serviço</h1>
    <p>Altere os dados do serviço abaixo.</p>
  </div>
</div>

<form method="POST" class="form-servico">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
  <div class="form-grupo">
    <label for="cliente">Cliente</label>

    <input
      type="text"
      id="cliente"
      name="cliente"
      value="{{ servico[1] }}"
      required
    />
  </div>

  <div class="form-grupo">
    <label for="servico">Serviço</label>

    <input
      type="text"
      id="servico"
      name="servico"
      value="{{ servico[2] }}"
      required
    />
  </div>

  <div class="form-grupo">
    <label for="descricao">Descrição</label>

    <textarea id="descricao" name="descricao" rows="3">
{{ servico[3] or "" }}</textarea
    >
  </div>

  <div class="form-linha">
    <div class="form-grupo">
      <label for="valor">Valor</label>

      <input
        type="number"
        id="valor"
        name="valor"
        step="0.01"
        value="{{ servico[4] }}"
        required
      />
    </div>

    <div class="form-grupo">
      <label for="forma_pagamento"> Forma de pagamento </label>

      <select id="forma_pagamento" name="forma_pagamento">
        <option value="">Selecione</option>

        <option value="Pix">Pix</option>

        <option value="Dinheiro">Dinheiro</option>

        <option value="Cartão">Cartão</option>

        <option value="Transferência">Transferência</option>
      </select>
    </div>
  </div>

  <div class="form-grupo">
    <label for="data">Data</label>

    <input type="date" id="data" name="data" value="{{ servico[6] }}" />
  </div>

  <div class="form-acoes">
    <a href="{{ url_for('servicos.index') }}" class="btn btn-secondary">
      ↩ Cancelar
    </a>

    <button type="submit" class="btn btn-primary">💾 Salvar Alterações</button>
  </div>
</form>

{% endblock %}
