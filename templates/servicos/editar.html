{% extends "layout/base.html" %} {% block titulo %} Editar Serviço {% endblock
%} {% block css %}
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/servicos.css') }}"
/>
{% endblock %} {% block conteudo %}

<div class="pagina-cabecalho">
  <div>
    <h1>Editar Serviço</h1>

    <p>Altere os dados do serviço abaixo.</p>
  </div>
</div>

<form method="POST" class="form-servico">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

  <div class="form-grupo">
    <label for="cliente"> Cliente </label>

    <input
      type="text"
      id="cliente"
      name="cliente"
      value="{{ servico['cliente'] }}"
      required
    />
  </div>

  <div class="form-grupo">
    <label for="servico"> Serviço </label>

    <input
      type="text"
      id="servico"
      name="servico"
      value="{{ servico['servico'] }}"
      required
    />
  </div>

  <div class="form-grupo">
    <label for="descricao"> Descrição </label>

    <textarea id="descricao" name="descricao" rows="3">
{{ servico['descricao'] or "" }}</textarea
    >
  </div>

  <div class="form-linha">
    <div class="form-grupo">
      <label for="valor"> Valor </label>

      <input
        type="number"
        id="valor"
        name="valor"
        step="0.01"
        value="{{ servico['valor'] }}"
        required
      />
    </div>

    <div class="form-grupo">
      <label for="forma_pagamento"> Forma de pagamento </label>

      <select id="forma_pagamento" name="forma_pagamento">
        <option value="">Selecione</option>

        {% if servico['forma_pagamento'] == 'Pix' %}

        <option value="Pix" selected>Pix</option>

        {% else %}

        <option value="Pix">Pix</option>

        {% endif %} {% if servico['forma_pagamento'] == 'Dinheiro' %}

        <option value="Dinheiro" selected>Dinheiro</option>

        {% else %}

        <option value="Dinheiro">Dinheiro</option>

        {% endif %} {% if servico['forma_pagamento'] == 'Cartão' %}

        <option value="Cartão" selected>Cartão</option>

        {% else %}

        <option value="Cartão">Cartão</option>

        {% endif %} {% if servico['forma_pagamento'] == 'Transferência' %}

        <option value="Transferência" selected>Transferência</option>

        {% else %}

        <option value="Transferência">Transferência</option>

        {% endif %}
      </select>
    </div>
  </div>

  <div class="form-grupo">
    <label for="data"> Data </label>

    <input type="date" id="data" name="data" value="{{ servico['data'] }}" />
  </div>

  <div class="form-acoes">
    <a href="{{ url_for('servicos.index') }}" class="btn btn-secondary">
      ↩ Cancelar
    </a>

    <button type="submit" class="btn btn-primary">💾 Salvar Alterações</button>
  </div>
</form>

{% endblock %}
