{% extends "layout/base.html" %} {% block titulo %} Novo Serviço {% endblock %}
{% block css %}
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/servicos.css') }}"
/>
{% endblock %} {% block conteudo %}

<div class="pagina-cabecalho">
  <div>
    <h1>Novo Serviço</h1>
    <p>Cadastre um novo serviço realizado.</p>
  </div>

  <a href="{{ url_for('servicos.index') }}" class="btn btn-secondary">
    ← Voltar
  </a>
</div>

<form
  method="POST"
  action="{{ url_for('servicos.novo') }}"
  class="form-servico"
>
  <div class="form-grupo">
    <label for="cliente">Cliente</label>

    <input
      type="text"
      id="cliente"
      name="cliente"
      placeholder="Nome do cliente"
      required
    />
  </div>

  <div class="form-grupo">
    <label for="servico">Serviço</label>

    <input
      type="text"
      id="servico"
      name="servico"
      placeholder="Nome do serviço"
      required
    />
  </div>

  <div class="form-grupo">
    <label for="descricao">Descrição</label>

    <textarea
      id="descricao"
      name="descricao"
      rows="4"
      placeholder="Descreva o serviço realizado..."
    ></textarea>
  </div>

  <div class="form-linha">
    <div class="form-grupo">
      <label for="valor">Valor</label>

      <input
        type="number"
        id="valor"
        name="valor"
        step="0.01"
        min="0"
        placeholder="0,00"
        required
      />
    </div>

    <div class="form-grupo">
      <label for="forma_pagamento">Forma de pagamento</label>

      <select id="forma_pagamento" name="forma_pagamento">
        <option value="">Selecione</option>
        <option value="pix">PIX</option>
        <option value="dinheiro">Dinheiro</option>
        <option value="cartao">Cartão</option>
        <option value="transferencia">Transferência</option>
        <option value="boleto">Boleto</option>
      </select>
    </div>
  </div>

  <div class="form-grupo">
    <label for="data">Data</label>

    <input type="date" id="data" name="data" required />
  </div>

  <div class="form-acoes">
    <a href="{{ url_for('servicos.index') }}" class="btn btn-secondary">
      Cancelar
    </a>

    <button type="submit" class="btn btn-primary">💾 Salvar Serviço</button>
  </div>
</form>

{% endblock %}
